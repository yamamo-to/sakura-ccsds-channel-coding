[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccsds-codec"
version = "0.1.0"
description = "CCSDS 131/132 compliant channel coding (RS, Conv, Turbo)."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Your Name", email = "you@example.com"},
]
dependencies = [
    "numpy",
    "numba",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "reedsolo",
]

[tool.ruff]
line-length = 100
preview = true
exclude = ["get-pip.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# galois.py: unrolled 8-bit basis-conversion loops (intentional, verified)
"src/ccsds_codec/core/galois.py" = ["E701"]
# turbo.py: encode() dispatches 4 CCSDS rate layouts in one function
"src/ccsds_codec/core/turbo.py" = ["C901"]

[tool.mypy]
strict = true

# numba's @njit wraps functions in a Dispatcher object whose callable type
# mypy cannot infer (known numba/mypy incompatibility, upstream issue #4440).
[[tool.mypy.overrides]]
module = ["ccsds_codec.core.convolutional", "ccsds_codec.core.turbo"]
disable_error_code = ["call-overload", "type-var", "operator"]
